server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    # Simple health endpoint for monitoring
    location = /healthz {
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Forward the Xtend stats endpoint used by Home Assistant.
    location = /api/stats/values {
        proxy_http_version 1.1;
        proxy_set_header Host 10.20.30.1;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Xtend AP endpoint
        proxy_pass http://10.20.30.1:80;

        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    # Forward all other paths so the Xtend web interface is available via proxy.
    location / {
        proxy_http_version 1.1;
        proxy_set_header Host 10.20.30.1;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass http://10.20.30.1:80;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
